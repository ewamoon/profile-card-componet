<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Profile card component</title>
  </head>
  <body>
    <main>
      <div class="user-card">
        <div class="info">
          <img src="./images/image-victor.jpg" alt="Portrait of Victor Crest" />
          <h1 class="user-name">Victor Crest <span class="age">26</span></h1>
          <p>London</p>
        </div>

        <hr class="line">
        <ul class="counter-list">
          <li class="followers">
            <span class="numbers">80K</span> <span class="text">Followers</span>
          </li>
          <li class="likes">
            <span class="numbers">803K</span> <span class="text">Likes</span>
          </li>
          <li class="photos">
            <span class="numbers">1.4K</span> <span class="text">Photos</span>
          </li>
        </ul>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">ewamoon</a>.
    </footer>
  </body>
</html>
